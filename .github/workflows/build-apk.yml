name: Build APK

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - 'ios/**'
      - 'readme.md'
  pull_request:
    paths-ignore:
      - 'ios/**'
      - 'readme.md'

permissions:
  contents: write

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: checkout sources
        uses: actions/checkout@v3

      - name: use Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v2
        with:
          distribution: 'temurin'
          java-version: 21

      - name: install dependencies
        run: npm ci

      - name: build Nuxt project
        run: npm run generate

      - name: copy to Android project
        run: npx cap sync

      - name: decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/keystore.jks

      - name: build signed release APK
        run: |
          ./android/gradlew assembleRelease -p android --no-daemon \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/keystore.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEYSTORE_PASSWORD }}"

      - name: rename apk
        id: apk
        working-directory: android/app/build/outputs/apk/release/
        run: |
          build="$(date +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)"
          name="audiobookshelf-${build}.apk"
          mv -v app-release.apk "${name}"
          echo "filename=${name}" >> $GITHUB_OUTPUT
          echo "tag=jk-${build}" >> $GITHUB_OUTPUT

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: audiobookshelf-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: create GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: ${{ steps.apk.outputs.tag }}
          body: |
            ## Audiobookshelf Android — fork build

            **Upstream verze:** v0.13.0-beta
            **Commit:** ${{ github.sha }}
            **Větev:** ${{ github.ref_name }}

            ### Co je v tomto forku

            #### Homepage — nedoposlouchané epizody
            - Podcast knihovny zobrazují seznam nedoposlouchaných epizod místo výchozí police
            - Řazení: datum vydání / zbývající čas / název podcastu
            - Filtrování: chip buttony pro každý podcast
            - Tlačítko "Načíst další" pro stránkování

            #### Fronta přehrávání
            - Tlačítko ➕ na každé epizodě přidá epizodu do fronty
            - Po skončení epizody se automaticky spustí další z fronty
            - Tap na stopu ve frontě ji rovnou přehraje
            - Store: `playerQueue[]` s mutacemi `addToQueue / removeFromQueue / shiftQueue / clearQueue`

            #### Queue panel v přehrávači
            - Tlačítko 🎵 ve fullscreen i mini přehrávači otevře panel fronty
            - Panel zobrazuje: právě hrající epizodu + seznam dalších v frontě
            - Přeskočit na další stopu: tlačítko `skip_next` v transport řadě
            - Základní ovládání (rewind / play-pause / forward / skip) přímo v panelu

            ---
            > ✅ Release APK — podepsáno konzistentním klíčem. Obtainium aktualizace fungují.
          files: android/app/build/outputs/apk/release/${{ steps.apk.outputs.filename }}
          make_latest: true

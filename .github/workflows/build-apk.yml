name: Build APK

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - 'ios/**'
      - 'readme.md'
  pull_request:
    paths-ignore:
      - 'ios/**'
      - 'readme.md'

permissions:
  contents: write

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: checkout sources
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: use Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v2
        with:
          distribution: 'temurin'
          java-version: 21

      - name: install dependencies
        run: npm ci

      - name: build Nuxt project
        run: npm run generate

      - name: copy to Android project
        run: npx cap sync

      - name: decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/keystore.jks

      - name: read version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION} → tag: ${TAG}"

      - name: build signed release APK
        run: |
          ./android/gradlew assembleRelease -p android --no-daemon \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/keystore.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEYSTORE_PASSWORD }}"

      - name: rename apk
        id: apk
        working-directory: android/app/build/outputs/apk/release/
        run: |
          name="audiobookshelf-${{ steps.version.outputs.tag }}.apk"
          mv -v app-release.apk "${name}"
          echo "filename=${name}" >> $GITHUB_OUTPUT

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: audiobookshelf-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: generate changelog
        id: changelog
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]' | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --oneline -20 --pretty="- %s")
          else
            LOG=$(git log "${PREV_TAG}..HEAD" --pretty="- %s")
            if [ -z "$LOG" ]; then
              LOG="- $(git log --oneline -1 --pretty='%s')"
            fi
          fi
          EOF_MARKER=$(openssl rand -hex 8)
          echo "log<<${EOF_MARKER}" >> $GITHUB_OUTPUT
          echo "$LOG" >> $GITHUB_OUTPUT
          echo "${EOF_MARKER}" >> $GITHUB_OUTPUT

      - name: create or update GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: |
            ## ${{ steps.version.outputs.tag }}

            **Commit:** `${{ github.sha }}` | **Větev:** `${{ github.ref_name }}`

            ### Changelog
            ${{ steps.changelog.outputs.log }}

            ---
            > ✅ Release APK — podepsáno konzistentním klíčem. In-app aktualizace podporovány.
          files: android/app/build/outputs/apk/release/${{ steps.apk.outputs.filename }}
          make_latest: true

      - name: deploy APK to server
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: jankoran.cz
          DEPLOY_USER: root
          DEPLOY_PATH: /root/abs-updates
          VERSION: ${{ steps.version.outputs.tag }}
          APK_FILE: android/app/build/outputs/apk/release/${{ steps.apk.outputs.filename }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p ${DEPLOY_PATH}"
          scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key \
            "${APK_FILE}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/audiobookshelf-latest.apk"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "printf '{\"version\":\"%s\",\"apk_url\":\"https://jankoran.cz/abs-updates/audiobookshelf-latest.apk\"}\n' '${VERSION}' > ${DEPLOY_PATH}/latest.json"
          rm ~/.ssh/deploy_key
